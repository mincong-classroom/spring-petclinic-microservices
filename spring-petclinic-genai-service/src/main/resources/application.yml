spring:
  main:
    web-application-type: reactive
  application:
    name: genai-service
  profiles:
    active: production
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/},optional:classpath:/creds.yaml
  ai:
    chat:
      client:
        enabled: true
    # These apply when using spring-ai-starter-model-azure-openai
    azure:
      openai:
        api-key: ${AZURE_OPENAI_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            temperature: 0.7
            deployment-name: gpt-4o
    # These apply when using spring-ai-starter-model-openai
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      chat:
        options:
            temperature: 0.7
            model: gpt-4o-mini


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

---
# Kubernetes, without the Config Server and the Discovery Server: the settings that the Config
# Server serves are here, and the other services are called by the name of their Service.
spring:
  config:
    activate:
      on-profile: kubernetes
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    # No load balancer on the client side: the name of a service is the one of its Service
    loadbalancer:
      enabled: false
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1
    export:
      zipkin:
        endpoint: http://tracing-server/api/v2/spans
logging:
  level:
    # The import of the first document is tried once, before Spring knows the profile: not logged
    org.springframework.cloud.config.client: ERROR
