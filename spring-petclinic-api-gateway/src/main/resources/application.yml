spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback
            - name: Retry
              args:
                retries: 1
                statuses: SERVICE_UNAVAILABLE
                methods: POST
          routes:
            - id: vets-service
              uri: lb://vets-service
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: lb://visits-service
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: lb://customers-service
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
            - id: genai-service
              uri: lb://genai-service
              predicates:
                - Path=/api/genai/**
              filters:
                - StripPrefix=2
                - CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback
  reactor:
    context-propagation: auto
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

---
# Kubernetes, without the Config Server and the Discovery Server: the settings that the Config
# Server serves are here, and the other services are called by the name of their Service.
spring:
  config:
    activate:
      on-profile: kubernetes
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    # No load balancer on the client side: the name of a service is the one of its Service
    loadbalancer:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: vets-service
              uri: http://vets-service
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: http://visits-service
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: http://customers-service
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
            - id: genai-service
              uri: http://genai-service
              predicates:
                - Path=/api/genai/**
              filters:
                - StripPrefix=2
                - CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback
  messages:
    basename: messages/messages
  # Not "auto" as above: with it, the gateway logs two warnings for each request
  reactor:
    context-propagation: limited
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 2048
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1
    export:
      zipkin:
        endpoint: http://tracing-server/api/v2/spans
logging:
  level:
    # The import of the first document is tried once, before Spring knows the profile: not logged
    org.springframework.cloud.config.client: ERROR
